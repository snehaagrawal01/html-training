<!DOCTYPE html>
<html lang="en">
<head>
   <title>textdecoration</title>
   <style>
    #box1{
        
        text-decoration: line-through;
    }
    #box2{
        text-decoration: overline;}
        #box3{
text-decoration: underline;
        }
    
   </style>
</head>
<body>
    <h3 id="box1" class="box">box1</h3>
    
    <h3 id="box2" class="box">box2</h3>
    <h3 id="box3" class="box">box3</h3>
    

</body>
</html>
