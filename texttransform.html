<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Document</title>
    <style>
        #box1{
            text-transform: lowercase;
        }
        #box2{
            text-transform: uppercase;
        }
        #box3{
            text-transform: capitalize;
        }
    </style>
</head>
<body>
   
    <h3 id="box1" class="box">lowercaseeee</h3>
    <h3 id="box2" class="box">uppercaseeee</h3>
    <h3 id="box3" class="box">capitalizeeeee</h3>
</body>
</html>
