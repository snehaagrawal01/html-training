<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Document</title>
    <style>
        .box{
            height:40px;
            width:40px;
            border:2px solid red;
            border-radius:5px;
            background-color:plum;
            position: relative;
            top:50px;
            left:30px;
            transition:all 0.5s ease-in;}

          .box:hover  {
             transform: scale(2);
            }


        
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
